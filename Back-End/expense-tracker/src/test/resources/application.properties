# Test configuration using in-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:expense_tracker_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false

app.jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-for-hmac-sha256
app.jwt.expiration-ms=86400000

app.cors.allowed-origin=http://localhost:5173

